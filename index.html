<script type="module">
  import { initializeApp } from "firebase/app";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updatePassword, EmailAuthProvider, reauthenticateWithCredential, signOut } from "firebase/auth";
  import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, query, where, getDocs, setDoc, getDoc, onSnapshot, serverTimestamp, orderBy } from "firebase/firestore";
  import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "firebase/storage";

  const firebaseConfig = {
    apiKey: "AIzaSyC_x8sb9AMxu_2fVPd13xPxi0WqY-dMMrs",
    authDomain: "sparojaycarsimport.firebaseapp.com",
    databaseURL: "https://sparojaycarsimport-default-rtdb.firebaseio.com",
    projectId: "sparojaycarsimport",
    storageBucket: "sparojaycarsimport.firebasestorage.app",
    messagingSenderId: "914529176756",
    appId: "1:914529176756:web:6227ef9c18583beee75be1",
    measurementId: "G-RFMJWVP14F"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);
  const ADMIN_UID = "btRBgPhSsiPsHtBRsqdUIQUqm7E3";

  let currentUser = null;
  let unsubscribeCars = null;
  let currentCurrency = 'GHS';
  const carsCache = {};

  function showToast(msg, type = "success") {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${msg}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function formatMoney(amount, currency = 'GHS') {
    const sym = currency === 'GHS' ? 'GHS ' : currency === 'USD' ? '$ ' : currency === 'EUR' ? '€ ' : '£ ';
    return sym + Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2 });
  }

  function parsePrice(priceStr) { return parseFloat(priceStr.replace(/[^0-9.-]+/g, '')) || 0; }

  function safeText(value, fallback = "") {
    if (value === undefined || value === null || value === "undefined") return fallback;
    return String(value);
  }

  function getCarTitle(data) {
    const brand = safeText(data.carBrand || data.brand, "Vehicle");
    const model = safeText(data.carModel || data.model, "");
    const year = safeText(data.carYear || data.year, "");
    return `${brand} ${model}${year ? ` (${year})` : ""}`.trim();
  }

  function formatCurrency(value) {
    const num = Number(value || 0);
    return `GHS ${num.toLocaleString("en-GH", { minimumFractionDigits: 2 })}`;
  }

  function renderPage(content, pageName, addBack = true) {
    if (!window.pageHistory) window.pageHistory = ['home'];
    if (window.pageHistory[window.pageHistory.length-1] !== pageName) window.pageHistory.push(pageName);
    const backHtml = (addBack && pageName !== 'home') ? `<button class="back-btn" id="globalBackBtn"><i class="fas fa-arrow-left"></i> Back</button>` : '';
    document.getElementById('app').innerHTML = backHtml + content;
    if (addBack && pageName !== 'home') {
      const backBtn = document.getElementById('globalBackBtn');
      if (backBtn) backBtn.onclick = () => {
        if (window.pageHistory.length > 1) {
          window.pageHistory.pop();
          const prevPage = window.pageHistory.pop();
          if (prevPage === 'showroom') renderShowroom();
          else if (prevPage === 'preorder') renderPreOrderForm();
          else if (prevPage === 'track') renderTracking();
          else if (prevPage === 'dashboard') renderCustomerDashboard();
          else if (prevPage === 'gallery') renderPublicGallery();
          else if (prevPage === 'admin') renderAdminPanel();
          else renderHome();
        } else renderHome();
      };
    }
  }

  function setupPasswordToggle(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input && icon) icon.addEventListener('click', () => { const type = input.getAttribute('type') === 'password' ? 'text' : 'password'; input.setAttribute('type', type); icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash'); });
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);
      let role;
      if (!userSnap.exists()) {
        role = (user.uid === ADMIN_UID) ? "admin" : "customer";
        const userData = { fullName: user.displayName || user.email.split('@')[0], email: user.email, phone: "", address: "", dob: "", avatar: "", role: role, createdAt: new Date(), updatedAt: new Date() };
        await setDoc(userRef, userData);
        currentUser = { uid: user.uid, ...userData };
      } else {
        const data = userSnap.data();
        if (user.uid === ADMIN_UID && data.role !== "admin") {
          await updateDoc(userRef, { role: "admin", updatedAt: new Date() });
          data.role = "admin";
        }
        currentUser = { uid: user.uid, ...data };
      }
      updateNavUI();
      if (currentUser.role === 'admin') renderAdminPanel();
      else renderHome();
    } else {
      currentUser = null;
      updateNavUI();
      renderHome();
    }

  // Share functions
  function getCarShareUrl(carId) {
    return `${window.location.origin}${window.location.pathname}?car=${encodeURIComponent(carId)}`;
  }

  function getCarShareText(car) {
    const title = `${safeText(car.brand, "Vehicle")} ${safeText(car.model, "")}`.trim();
    const year = safeText(car.year, "");
    const price = formatCurrency(car.price || 0);
    const status = safeText(car.status, "Available");
    const link = getCarShareUrl(car.id);
    return `Check out this vehicle:\n\n${title}\nYear: ${year || "Not specified"}\nPrice: ${price}\nStatus: ${status}\n\nView details:\n${link}`;
  }

  async function shareCar(car, platform) {
    const text = getCarShareText(car);
    const link = getCarShareUrl(car.id);
    const encodedText = encodeURIComponent(text);
    const encodedLink = encodeURIComponent(link);
    if (platform === "whatsapp") {
      window.open(`https://wa.me/?text=${encodedText}`, "_blank");
    } else if (platform === "facebook") {
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodedLink}`, "_blank");
    } else if (platform === "sms") {
      window.location.href = `sms:?&body=${encodedText}`;
    } else if (platform === "copy") {
      await navigator.clipboard.writeText(link);
      showToast("Car link copied to clipboard!");
    } else if (platform === "more") {
      if (navigator.share) {
        await navigator.share({
          title: `${safeText(car.brand, "Vehicle")} ${safeText(car.model, "")}`.trim(),
          text: text,
          url: link
        });
      } else {
        await navigator.clipboard.writeText(link);
        showToast("Sharing not supported, link copied instead.");
      }
    }
  }

  // ========== SHOWROOM (real-time with onSnapshot) ==========
  let unsubscribeShowroomCars = null;

  function loadShowroomCars(containerId = "showroomGrid") {
    const showroomBox = document.getElementById(containerId);
    if (!showroomBox) return;
    showroomBox.innerHTML = `<div class="glass" style="padding:2rem; text-align:center;">Loading luxury vehicles...</div>`;
    if (unsubscribeShowroomCars) unsubscribeShowroomCars();
    const carsRef = collection(db, "cars");
    unsubscribeShowroomCars = onSnapshot(carsRef, (snapshot) => {
      if (snapshot.empty) {
        showroomBox.innerHTML = `<div class="glass" style="padding:2rem; text-align:center;">No cars available at the moment.</div>`;
        return;
      }
      const cars = [];
      snapshot.forEach((docSnap) => {
        const car = docSnap.data();
        const shouldShow = car.visible !== false && car.status !== "Hidden";
        if (shouldShow) {
          const carData = { id: docSnap.id, ...car };
          cars.push(carData);
          carsCache[carData.id] = carData;
        }
      });
      cars.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
      if (cars.length === 0) {
        showroomBox.innerHTML = `<div class="glass" style="padding:2rem; text-align:center;">No cars available at the moment.</div>`;
        return;
      }
      const exchangeRates = { USD: 1, EUR: 0.92, GBP: 0.79, GHS: 12.5 };
      showroomBox.innerHTML = cars.map(car => {
        const basePrice = parsePrice(car.price);
        const converted = currentCurrency === 'GHS' ? basePrice : basePrice / exchangeRates.GHS * (exchangeRates[currentCurrency] || 1);
        const priceDisplay = formatMoney(converted, currentCurrency);
        const statusClass = `badge-${car.status?.toLowerCase().replace(/ /g,'-') || 'available'}`;
        return `
          <div class="car-card">
            <div class="carousel-container" id="carousel-${car.id}"><div class="carousel-slide" style="background-image:url('${car.imageUrl || car.images?.[0] || 'https://via.placeholder.com/400x220'}');"></div><button class="carousel-btn prev" data-id="${car.id}"><i class="fas fa-chevron-left"></i></button><button class="carousel-btn next" data-id="${car.id}"><i class="fas fa-chevron-right"></i></button><div class="carousel-counter" style="position:absolute; bottom:5px; right:5px; background:rgba(0,0,0,0.6); padding:2px 6px; border-radius:20px; font-size:0.7rem;">1/${(car.images?.length || 1)}</div></div>
            <div class="car-info">
              <h3>${car.brand} ${car.model} (${car.year})</h3>
              <div class="car-price">${priceDisplay}</div>
              <div><span class="badge ${statusClass}">${car.status || 'Available'}</span> ${car.featured ? '<span class="badge" style="background:#D4AF37;">⭐ Featured</span>' : ''}</div>
              <div class="car-specs">${car.transmission || 'N/A'} | ${car.mileage || 'N/A'} km | ${car.fuel || 'N/A'}</div>
              <div class="action-buttons">
                <button class="enquiry-btn" onclick="window.showEnquiryModalById('${car.id}')"><i class="fas fa-comment-dots"></i> Enquiry</button>
                <button class="save-car-btn" onclick="saveCarById('${car.id}')"><i class="fas fa-heart"></i> Save</button>
                <div class="share-dropdown">
                  <button class="share-btn-trigger" data-car-id="${car.id}"><i class="fas fa-share-alt"></i> Share</button>
                  <div class="share-dropdown-content" id="share-dropdown-${car.id}">
                    <button onclick="shareCarById('${car.id}', 'whatsapp')"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                    <button onclick="shareCarById('${car.id}', 'facebook')"><i class="fab fa-facebook"></i> Facebook</button>
                    <button onclick="shareCarById('${car.id}', 'sms')"><i class="fas fa-sms"></i> SMS</button>
                    <button onclick="shareCarById('${car.id}', 'copy')"><i class="fas fa-copy"></i> Copy Link</button>
                    <button onclick="shareCarById('${car.id}', 'more')"><i class="fas fa-share-alt"></i> More</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
      cars.forEach(car => initCarousel(car.id, car.images || [car.imageUrl]));
      document.querySelectorAll('.share-btn-trigger').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const dropdown = document.getElementById(`share-dropdown-${btn.dataset.carId}`);
          if (dropdown) {
            dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
          }
        };
      });
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.share-dropdown')) {
          document.querySelectorAll('.share-dropdown-content').forEach(d => d.style.display = 'none');
        }
      });
    }, (error) => {
      console.error(error);
      showroomBox.innerHTML = `<div class="glass" style="padding:2rem; text-align:center;">⚠️ Unable to load cars. Check Firestore rules.</div>`;
    });
  }

  function initCarousel(carId, images) {
    if (!images || images.length === 0) images = ["https://via.placeholder.com/400x220"];
    let idx = 0;
    const slide = document.querySelector(`#carousel-${carId} .carousel-slide`), prev = document.querySelector(`.carousel-btn.prev[data-id="${carId}"]`), next = document.querySelector(`.carousel-btn.next[data-id="${carId}"]`), counter = document.querySelector(`#carousel-${carId} .carousel-counter`);
    const update = () => { slide.style.backgroundImage = `url('${images[idx]}')`; if(counter) counter.innerText = `${idx+1}/${images.length}`; };
    if (prev) prev.onclick = (e) => { e.stopPropagation(); idx = (idx-1+images.length)%images.length; update(); };
    if (next) next.onclick = (e) => { e.stopPropagation(); idx = (idx+1)%images.length; update(); };
    update();
    slide.addEventListener('click', () => openFullscreenGallery(images, idx));
  }

  function openFullscreenGallery(images, startIdx) {
    const modal = document.createElement('div'); modal.className = 'modal';
    let idx = startIdx;
    modal.innerHTML = `<div style="position:relative;"><img id="fullImg" src="${images[idx]}" style="max-width:90%; max-height:80vh; border-radius:1rem;"><button id="prevFull" style="position:absolute; left:20px; top:50%; background:rgba(0,0,0,0.6); border:none; color:white; padding:10px; border-radius:50%; cursor:pointer;"><i class="fas fa-chevron-left"></i></button><button id="nextFull" style="position:absolute; right:20px; top:50%; background:rgba(0,0,0,0.6); border:none; color:white; padding:10px; border-radius:50%; cursor:pointer;"><i class="fas fa-chevron-right"></i></button><button id="closeFull" style="position:absolute; top:20px; right:20px; background:red; border:none; color:white; padding:8px; border-radius:50%; cursor:pointer;">✕</button></div>`;
    document.body.appendChild(modal);
    const updateImg = () => { document.getElementById('fullImg').src = images[idx]; };
    document.getElementById('prevFull').onclick = () => { idx = (idx-1+images.length)%images.length; updateImg(); };
    document.getElementById('nextFull').onclick = () => { idx = (idx+1)%images.length; updateImg(); };
    document.getElementById('closeFull').onclick = () => modal.remove();
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  }

  async function populateFilterOptions() {
    const snap = await getDocs(collection(db, "cars"));

    const brands = [...new Set(cars.map(c => c.brand).filter(Boolean))];
    const years = [...new Set(cars.map(c => c.year).filter(Boolean))].sort();

  // Shipped Gallery Admin (real-time)
  async function renderShippedGalleryAdmin() {
    const container = document.getElementById('adminContent');
    container.innerHTML = `
      <div class="glass" style="padding:1rem; margin-bottom:1rem;">
        <h3>Upload to Shipped & Cleared Gallery</h3>
        <form id="uploadGalleryForm">
          <div class="form-row"><div class="form-group"><label>Title</label><input id="galleryTitle" required></div><div class="form-group"><label>Description</label><input id="galleryDesc"></div></div>
          <div class="form-row"><div class="form-group"><label>Car Brand</label><input id="galleryBrand"></div><div class="form-group"><label>Car Model</label><input id="galleryModel"></div><div class="form-group"><label>Year</label><input id="galleryYear" type="number"></div></div>
          <div class="form-group"><label>Media File (Image/Video)</label><input type="file" id="galleryMediaFile" accept="image/jpeg,image/jpg,image/png,image/webp,video/mp4,video/webm,video/quicktime"></div>
          <button type="submit" class="btn-green">Upload</button>
        </form>
      </div>
      <h3>Existing Gallery Items</h3>
      <div id="galleryList" class="gallery-grid">Loading...</div>
    `;
    // Real-time gallery list
    const galleryRef = collection(db, "shippedGallery");
    const q = query(galleryRef, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      const galleryList = document.getElementById('galleryList');
      if (!galleryList) return;
      if (items.length === 0) { galleryList.innerHTML = '<div class="glass" style="padding:1rem;">No items yet.</div>'; return; }
      galleryList.innerHTML = items.map(item => `
        <div class="gallery-item">
          ${item.mediaType === 'image' ? `<img src="${item.mediaUrl}" alt="${item.title}">` : `<video controls src="${item.mediaUrl}"></video>`}
          <div class="info">
            <strong>${item.title}</strong><br>
            ${item.carBrand} ${item.carModel} (${item.year || ''})<br>
            ${item.description || ''}<br>
            <small>${item.createdAt?.toDate().toLocaleString()}</small><br>
            <button class="btn-red delete-gallery-item" data-id="${item.id}">Delete</button>
          </div>
        </div>
      `).join('');
      document.querySelectorAll('.delete-gallery-item').forEach(btn => btn.onclick = async () => {
        const id = btn.dataset.id;
        const item = items.find(i => i.id === id);
        if (item && item.mediaPath) {
          try {
            const mediaRef = ref(storage, item.mediaPath);
            await deleteObject(mediaRef);
          } catch(e) {}
        }
        await deleteDoc(doc(db, "shippedGallery", id));
      });
    });

    document.getElementById('uploadGalleryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('galleryTitle').value.trim();
      const description = document.getElementById('galleryDesc').value.trim();
      const carBrand = document.getElementById('galleryBrand').value.trim();
      const carModel = document.getElementById('galleryModel').value.trim();
      const year = document.getElementById('galleryYear').value;
      const file = document.getElementById('galleryMediaFile').files[0];
      if (!title || !file) return showToast("Title and media file required", "error");
      const allowedTypes = ['image/jpeg','image/jpg','image/png','image/webp','video/mp4','video/webm','video/quicktime'];
      if (!allowedTypes.includes(file.type)) return showToast("Unsupported file type", "error");
      const maxSize = 100 * 1024 * 1024;
      if (file.size > maxSize) return showToast("File too large (max 100MB)", "error");
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${title.replace(/[^a-z0-9]/gi,'_')}.${fileExt}`;
      const storageRef = ref(storage, `shipped-gallery/${fileName}`);
      await uploadBytes(storageRef, file);
      const mediaUrl = await getDownloadURL(storageRef);
      const mediaType = file.type.startsWith('image/') ? 'image' : 'video';
      await addDoc(collection(db, "shippedGallery"), {
        title, description, carBrand, carModel, year: year ? Number(year) : null,
        mediaUrl, mediaPath: `shipped-gallery/${fileName}`, mediaType,
        uploadedBy: currentUser.uid,
        createdAt: serverTimestamp()
      });
      showToast("Uploaded successfully");
      document.getElementById('uploadGalleryForm').reset();
    });
  }

    const content = `
      <div class="container">
        <h2>🚢 Previously Shipped & Cleared Cars</h2>
        <div id="publicGalleryGrid" class="gallery-grid">Loading...</div>
      </div>
    `;
    renderPage(content, 'gallery', true);
    const galleryRef = collection(db, "shippedGallery");
    onSnapshot(galleryRef, (snapshot) => {
      const items = snapshot.docs.map(d => d.data());
      const grid = document.getElementById('publicGalleryGrid');
      if (!grid) return;
      if (items.length === 0) { grid.innerHTML = '<div class="glass" style="padding:2rem;">No shipped cars yet.</div>'; return; }
      grid.innerHTML = items.map(item => `
        <div class="gallery-item">
          ${item.mediaType === 'image' ? `<img src="${item.mediaUrl}" alt="${item.title}">` : `<video controls src="${item.mediaUrl}"></video>`}
          <div class="info">
            <strong>${item.title}</strong><br>
            ${item.carBrand ? `${item.carBrand} ${item.carModel}` : ''} ${item.year ? `(${item.year})` : ''}<br>
            ${item.description || ''}
          </div>
        </div>
      `).join('');
    });
  }

  function renderHome() {
    const content = `
      <div class="hero">
        <div>
          <h1>Your Dream Car Awaits</h1>
          <p>Direct Japan & Korea Imports | Real‑Time Showroom | Pro‑Forma Invoices</p>
          <button id="exploreBtn" class="btn-primary">Explore Showroom <i class="fas fa-arrow-right"></i></button>
        </div>
      </div>
      <div class="container">
        <div style="display:flex; gap:1.5rem; justify-content:center; flex-wrap:wrap; margin:2rem 0;">
          <div class="glass" style="text-align:center; padding:1.5rem; flex:1; min-width:180px;"><i class="fas fa-ship" style="font-size:2rem; color:#D4AF37;"></i><h3>Direct Import</h3><p>From Japan/Korea to Ghana</p></div>
          <div class="glass" style="text-align:center; padding:1.5rem; flex:1; min-width:180px;"><i class="fab fa-whatsapp" style="font-size:2rem; color:#D4AF37;"></i><h3>24/7 WhatsApp</h3><p>Instant support & quotes</p></div>
          <div class="glass" style="text-align:center; padding:1.5rem; flex:1; min-width:180px;"><i class="fas fa-file-invoice" style="font-size:2rem; color:#D4AF37;"></i><h3>Pro‑Forma Invoice</h3><p>Transparent pricing</p></div>
        </div>
        <div id="featuredCars" class="car-grid"><h3>⭐ Featured Vehicles</h3><div>Loading...</div></div>
        <div id="publicGalleryPreview" class="gallery-grid" style="margin-top:2rem;"><h3>📸 Recently Shipped & Cleared</h3><div>Loading gallery...</div></div>
      </div>
    `;
    renderPage(content, 'home', false);
    document.getElementById('exploreBtn').onclick = () => renderShowroom();
    loadFeaturedCars();
    loadPublicGalleryPreview();
  }

  async function loadFeaturedCars() {
    const snap = await getDocs(query(collection(db, "cars"), where("featured", "==", true)));
    const cars = snap.docs.map(d => d.data()).filter(c => c.visible !== false);
    const container = document.getElementById('featuredCars');
    if (!cars.length) { container.innerHTML = '<h3>⭐ Featured Vehicles</h3><div class="glass" style="padding:1rem;">No featured cars yet.</div>'; return; }
    container.innerHTML = `<h3>⭐ Featured Vehicles</h3><div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:1.5rem;">${cars.map(c => `<div class="car-card"><img src="${c.imageUrl || 'https://via.placeholder.com/400x220'}" style="width:100%; height:160px; object-fit:cover;"><div class="car-info"><h4>${c.brand} ${c.model}</h4><div class="car-price">${c.price}</div></div></div>`).join('')}</div>`;
  }

  async function loadPublicGalleryPreview() {
    const container = document.getElementById('publicGalleryPreview');
    const snap = await getDocs(query(collection(db, "shippedGallery"), orderBy("createdAt", "desc"), limit(6)));
    const items = snap.docs.map(d => d.data());
    if (items.length === 0) {
      container.innerHTML = '<h3>📸 Recently Shipped & Cleared</h3><div class="glass" style="padding:1rem;">No shipped cars yet. Check back soon!</div>';
      return;
    }
    container.innerHTML = `<h3>📸 Recently Shipped & Cleared</h3><div class="gallery-grid">${items.map(item => `
      <div class="gallery-item">
        ${item.mediaType === 'image' ? `<img src="${item.mediaUrl}" alt="${item.title}">` : `<video controls src="${item.mediaUrl}"></video>`}
        <div class="info">
          <strong>${item.title}</strong><br>
          ${item.carBrand ? `${item.carBrand} ${item.carModel}` : ''} ${item.year ? `(${item.year})` : ''}
        </div>
      </div>
    `).join('')}</div>`;
  }

  function setupNav() {
    document.getElementById('navHome').onclick = () => renderHome();
    document.getElementById('navShowroom').onclick = () => renderShowroom();
    document.getElementById('navPreOrder').onclick = () => renderPreOrderForm();
    document.getElementById('navTrack').onclick = () => renderTracking();
    document.getElementById('navDashboard').onclick = () => currentUser ? renderCustomerDashboard() : showToast("Login first","error");
    document.getElementById('navGallery').onclick = () => renderPublicGallery();
    document.getElementById('navAdmin').onclick = () => currentUser?.role === 'admin' ? renderAdminPanel() : showAuthModal();
    document.getElementById('authBtn').onclick = () => showAuthModal();
    document.getElementById('logoutSpan').onclick = () => logout();
    document.getElementById('floatWhatsApp').onclick = () => window.open(`https://wa.me/447348624530`, '_blank');
    document.getElementById('notificationIcon')?.addEventListener('click', () => { if(currentUser) renderCustomerDashboard(); });
  }

  renderHome(); setupNav();
</script>
